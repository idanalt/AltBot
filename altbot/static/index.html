<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AltBot · חדר צוות</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --text: #1d2130; --muted: #6b7185; --border: #e3e6ef;
    --accent: #5b5bd6; --accent-text: #fff; --bubble: #f1f2f8; --final: #eef8f1; --final-border: #6cc08b;
    --decision: #fff7e6; --error: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131a; --panel: #1b1d27; --text: #e8eaf2; --muted: #9399ad; --border: #2c2f3d;
      --accent: #8b8bf0; --accent-text: #12131a; --bubble: #232634; --final: #17291f; --final-border: #4e9f6c;
      --decision: #2d2717; --error: #3a1f22;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; }
  header span { color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 16px; height: calc(100vh - 58px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow: auto; }
  h2 { font-size: 15px; margin: 4px 0 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .agent { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .agent .top { display: flex; gap: 6px; }
  .agent .top input.emoji { width: 52px; flex: none; text-align: center; }
  .agent.leader { border-color: var(--accent); }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 7px 12px; font: inherit; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; width: 100%; padding: 11px; margin-top: 12px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.del { flex: none; }
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .phase { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
  .msg { background: var(--bubble); border-radius: 12px; padding: 10px 14px; max-width: 95%; }
  .msg .who { font-weight: 600; margin-bottom: 4px; }
  .msg .body { unicode-bidi: plaintext; white-space: pre-wrap; line-height: 1.55; }
  .msg.decision { background: var(--decision); font-size: 14px; }
  .msg.error { background: var(--error); }
  .msg.final { background: var(--final); border: 2px solid var(--final-border); max-width: 100%; }
  .typing::after { content: "▍"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; line-height: 1.8; }
  .final-actions { margin-top: 8px; }
</style>
</head>
<body>
<header><h1>🤝 AltBot</h1><span>הקם צוות סוכנים, תן לכל אחד תפקיד, והם ידונו ביניהם עד לתוצאה</span></header>
<main>
  <section class="panel">
    <h2>הצוות</h2>
    <label>תבנית צוות</label>
    <select id="preset"></select>
    <div class="row">
      <div><label>מצב דיון</label>
        <select id="mode">
          <option value="round_robin">סבבים (כל אחד בתורו)</option>
          <option value="moderated">המנהל בוחר מי מדבר</option>
        </select></div>
      <div><label id="roundsLabel">מספר סבבים</label><input id="rounds" type="number" min="1" max="40" value="2"></div>
    </div>
    <div class="row">
      <div><label>מודל</label>
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
          <option value="claude-fable-5-1">Claude Fable 5.1</option>
        </select></div>
      <div><label>עומק חשיבה</label>
        <select id="effort">
          <option value="low">נמוך</option><option value="medium" selected>בינוני</option>
          <option value="high">גבוה</option><option value="xhigh">גבוה מאוד</option><option value="max">מקסימלי</option>
        </select></div>
    </div>
    <label>הסוכנים</label>
    <div id="agents"></div>
    <button id="addAgent">➕ הוסף סוכן</button>
    <label>מנהל הצוות (מנחה את הדיון וכותב את התוצאה הסופית)</label>
    <div id="leader"></div>
    <label>מה אתה רוצה שהצוות יעשה?</label>
    <textarea id="task" dir="auto" rows="5" placeholder="לדוגמה: תכננו לי אפליקציה לניהול תקציב משפחתי"></textarea>
    <button class="primary" id="go">🚀 התחילו לעבוד</button>
  </section>
  <section class="panel">
    <div class="chat" id="chat"><div class="empty">כאן תראה את הסוכנים מדברים זה עם זה בזמן אמת,<br>ובסוף — את התוצאה הסופית.</div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let presets = [];

function agentCard(a, isLeader) {
  const div = document.createElement("div");
  div.className = "agent" + (isLeader ? " leader" : "");
  div.innerHTML = `<div class="top">
      <input class="emoji" maxlength="4"><input class="name" dir="auto" placeholder="שם הסוכן">
      ${isLeader ? "" : '<button class="del" title="הסר">✕</button>'}
    </div>
    <label>תפקיד / הנחיות</label><textarea class="role" dir="auto" rows="3" placeholder="מה התפקיד שלו בצוות?"></textarea>`;
  div.querySelector(".emoji").value = a.emoji || "🤖";
  div.querySelector(".name").value = a.name || "";
  div.querySelector(".role").value = (a.role || "").trim();
  const del = div.querySelector(".del");
  if (del) del.onclick = () => div.remove();
  return div;
}
const readCard = (d) => ({ emoji: d.querySelector(".emoji").value, name: d.querySelector(".name").value, role: d.querySelector(".role").value });

function syncRoundsLabel() {
  const moderated = $("mode").value === "moderated";
  $("roundsLabel").textContent = moderated ? "מקסימום תורות" : "מספר סבבים";
}

function applyTeam(t) {
  $("mode").value = t.mode || "round_robin";
  $("rounds").value = t.mode === "moderated" ? (t.max_turns || 8) : (t.rounds || 2);
  if (t.model) $("model").value = t.model;
  if (t.effort) $("effort").value = t.effort;
  $("agents").replaceChildren(...(t.agents || []).map((a) => agentCard(a, false)));
  $("leader").replaceChildren(agentCard(t.leader || { name: "מנהל הצוות", emoji: "🧭", role: "You lead the team and write the final deliverable." }, true));
  syncRoundsLabel();
}

function readTeam() {
  const mode = $("mode").value, n = parseInt($("rounds").value) || 2;
  return {
    name: $("preset").selectedOptions[0]?.textContent || "צוות",
    mode, rounds: n, max_turns: n, language: "Hebrew",
    model: $("model").value, effort: $("effort").value,
    agents: [...$("agents").children].map(readCard),
    leader: readCard($("leader").firstChild),
  };
}

async function loadPresets() {
  presets = await (await fetch("/api/teams")).json();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("altbot.team")); } catch {}
  const opts = presets.map((p) => new Option(p.name, p.id));
  if (saved) opts.unshift(new Option("הצוות האחרון שלי", "__saved"));
  $("preset").replaceChildren(...opts);
  applyTeam(saved || presets[0]);
  $("preset").onchange = () => applyTeam($("preset").value === "__saved" ? saved : presets.find((p) => p.id === $("preset").value));
}

$("mode").onchange = syncRoundsLabel;
$("addAgent").onclick = () => $("agents").appendChild(agentCard({ emoji: "🤖" }, false));

function bubble(cls, who, text = "") {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = `<div class="who"></div><div class="body"></div>`;
  d.querySelector(".who").textContent = who;
  d.querySelector(".body").textContent = text;
  $("chat").appendChild(d);
  d.scrollIntoView({ block: "end" });
  return d;
}

function handle(e, state) {
  const chat = $("chat");
  if (e.type === "phase") { const p = document.createElement("div"); p.className = "phase"; p.textContent = "— " + e.label + " —"; chat.appendChild(p); }
  else if (e.type === "turn_start") { state.cur = bubble(e.final ? "final" : "", `${e.emoji} ${e.agent}${e.final ? " · התוצאה הסופית" : ""}`); state.cur.querySelector(".body").classList.add("typing"); }
  else if (e.type === "delta") { state.cur.querySelector(".body").textContent += e.text; if (state.follow) state.cur.scrollIntoView({ block: "end" }); }
  else if (e.type === "turn_end") { state.cur?.querySelector(".body").classList.remove("typing"); }
  else if (e.type === "decision") bubble("decision", `${e.emoji} ${e.agent} (החלטת מנהל)`, e.text);
  else if (e.type === "error") bubble("error", `⚠️ שגיאה${e.agent ? " · " + e.agent : ""}`, e.message);
  else if (e.type === "final" && state.cur) {
    const b = document.createElement("button"); b.textContent = "📋 העתק תוצאה";
    b.onclick = () => navigator.clipboard.writeText(e.text).then(() => (b.textContent = "✅ הועתק"));
    const wrap = document.createElement("div"); wrap.className = "final-actions"; wrap.appendChild(b);
    state.cur.appendChild(wrap);
  }
}

$("go").onclick = async () => {
  const team = readTeam(), task = $("task").value.trim();
  if (!task) return alert("כתוב קודם מה אתה רוצה שהצוות יעשה");
  try { localStorage.setItem("altbot.team", JSON.stringify(team)); } catch {}
  $("go").disabled = true; $("go").textContent = "⏳ הצוות עובד...";
  $("chat").replaceChildren();
  bubble("", "🙋 הבקשה שלך", task);
  const state = { cur: null, follow: true };
  try {
    const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ task, team }) });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail || res.statusText)); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (line.startsWith("data: ")) handle(JSON.parse(line.slice(6)), state);
      }
    }
  } catch (err) { bubble("error", "⚠️ שגיאה", err.message); }
  $("go").disabled = false; $("go").textContent = "🚀 התחילו לעבוד";
};

loadPresets();
</script>
</body>
</html>
